<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430" role="img" aria-label="LANTHORN session">
  <defs>
    <clipPath id="tframe"><rect x="0" y="0" width="1100" height="430" rx="12"/></clipPath>
    <filter id="tglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    /* Opacity is never animated: a staggered fade would leave every line
       invisible during its own delay, which is exactly what a renderer that
       ignores animation (or samples frame zero) would show. Only the slide
       moves, so the text is legible in every renderer and still animates in. */
    .ln { font: 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
           animation: rise .5s ease-out backwards; }
    @keyframes rise { from { transform: translateY(8px); }
                       to   { transform: translateY(0); } }
    .cur { animation: blink 1.05s steps(1,end) infinite; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .title { font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
              fill: #6b6b6b; }
    @media (prefers-reduced-motion: reduce) {
      .ln { animation: none; opacity: 1; } .cur { animation: none; }
    }
  </style>

  <g clip-path="url(#tframe)">
    <rect width="1100" height="430" fill="#000000"/>
    <rect width="1100" height="46" fill="#111111"/>
    <circle cx="28" cy="23" r="6.5" fill="#ff5f57"/>
    <circle cx="50" cy="23" r="6.5" fill="#febc2e"/>
    <circle cx="72" cy="23" r="6.5" fill="#28c840"/>
    <text class="title" x="550" y="28" text-anchor="middle">Lanthorn</text>
    <line x1="0" y1="46" x2="1100" y2="46" stroke="#6b6b6b" stroke-opacity="0.6"/>

    <text x="34" y="76" fill="#d4d4d4" style="font:13px ui-monospace,Menlo,monospace">
      <tspan font-weight="600">✳ Lanthorn</tspan><tspan fill="#6b6b6b">  v1.0.0</tspan>
    </text>
    <text x="34" y="96" fill="#d4d4d4" style="font:13px ui-monospace,Menlo,monospace">deepseek-v4.1-flash</text>

      <text class="ln" x="34" y="104" fill="#d4d4d4" style="animation-delay:0.55s">❯ add a rate limiter to the API client</text>
      <text class="ln" x="34" y="138" fill="#6b6b6b" style="animation-delay:1.17s">  reading src/api/client.py</text>
      <text class="ln" x="34" y="172" fill="#6b6b6b" style="animation-delay:1.79s">  bash  pytest tests/test_client.py -q</text>
      <text class="ln" x="34" y="206" fill="#d4d4d4" style="animation-delay:2.41s">  9 passed in 0.31s</text>
      <text class="ln" x="34" y="240" fill="#6b6b6b" style="animation-delay:3.03s">  write_file  src/util/limiter.py</text>
      <text class="ln" x="34" y="274" fill="#d4d4d4" style="animation-delay:3.65s">  wrote src/util/limiter.py (42 lines)</text>

    <rect class="cur" x="34" y="413" width="9" height="14" fill="#d4d4d4"/>

    <text x="34" y="384" fill="#6b6b6b" style="font:13px ui-monospace,Menlo,monospace">
      deepseek-v4.1-flash   ·   api   ·   ~/projects/api   ·   <tspan fill="#d4d4d4">auto</tspan>
    </text>
    <text x="34" y="402" fill="#6b6b6b" style="font:13px ui-monospace,Menlo,monospace">
      ● idle   ·   auto mode
    </text>
    <rect x="34" y="410" width="1032" height="0.5" fill="#6b6b6b"/>
    <text x="34" y="424" fill="#6b6b6b" style="font:13px ui-monospace,Menlo,monospace">❯ </text>
    <rect x="0.5" y="0.5" width="1099" height="429" rx="12" fill="none" stroke="#6b6b6b" stroke-opacity="0.55"/>
    <rect x="0.5" y="0.5" width="1099" height="429" rx="12" fill="none" stroke="#6b6b6b" stroke-opacity="0.55"/>
  </g>
</svg>
